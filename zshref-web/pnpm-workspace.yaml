# Self-rooting marker: makes `pnpm install` here treat zshref-web as its own
# workspace root instead of walking up to the monorepo's pnpm-workspace.yaml
# and operating on that workspace. (`.npmrc ignore-workspace` is NOT honored by
# `pnpm install` — the flag `--ignore-workspace` is, but a file needs no flag.)
# No sub-packages — zshref-web is the lone project. Drop post-extraction.
packages: []

# pnpm >=11: `allowBuilds` replaces the old `onlyBuiltDependencies` list; an
# unlisted build script is a hard install error, so every one is decided here.
# `onnxruntime-node` (native ORT for the local-model sanity test) and its
# transitive `protobufjs`/`sharp` come in via @huggingface/transformers.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
