# yaml-language-server: $schema=./schema/sentence-fixture.schema.json
# Hand-curated natural-language queries for evaluating semantic search.
# Each entry: a paraphrased question and the canonical record(s) it
# should retrieve.

version: 4
default-weight: 1.0      # to override: 'w: <weight>'
default-target-depth: 3  # to override: 'd: <depth>'

# Note: this file is carefully hand-curated, often by humans. Agents must edit with care, and not remove comments, unless instructed by the user to do so.

entries:

- query: "what shell option avoids typing cd to change directory"
  want:
  - { cat: option, id: autocd }

- query: "what shell option avoids typing the cd builtin to change directory"
  want:
  - { cat: option, id: autocd }
  # using 'builtin' in the sentence; harder for the nlp

- query: "what zsh setting for just typing a directory name to change to it"
  want:
  - { cat: option, id: autocd, w: 0.7 }
  holdout: true

- query: "what option lets the prompt expand parameters and command substitutions"
  want:
  - { cat: option, id: promptsubst }

- query: "how can I insert value of a parameter in the prompt"
  want:
  - { cat: option, id: promptsubst, d: 5, w: 0.7 }
  holdout: true

- query: "how can I insert output of a command into the prompt"
  want:
  - { cat: option, id: promptsubst, d: 5, w: 0.7 }

- query: "to change directory without using the cd builtin, what shell option can I use?"
  want:
  - { cat: option, id: autocd, w: 0.5 }
  # some pressure on the nlp here, suspecting a query like this might be likely to give builtin/cd as the answer

- query: "I want to make the displayed list of completions more compact"
  want:
  - { cat: option, id: listpacked }

- query: "how indicate file type when file completions are shown"
  want:
  - { cat: option, id: listtypes }
  holdout: true

- query: "automatically accept a completion if it matches exactly"
  want:
  - { cat: option, id: recexact }
  holdout: true

- query: "make globbing case insensitive"
  want:
  - { cat: option, id: caseglob }
  - { cat: option, id: casepaths, w: 0.7 }

- query: "how to disable brace expansion"
  want:
  - { cat: option, id: ignorebraces }

- query: "an option so that parameters that don't exist are treated as empty strings"
  want:
  - { cat: option, id: unset }

- query: "treat parameters that don't exist as empty strings"
  want:
  - { cat: option, id: unset, w: 0.7 }

- query: "treat non-exising variables the same as if they were empty"
  want:
  - { cat: option, id: unset, w: 0.7 }
  holdout: true

- query: "how do I make zsh automatically push directories onto the stack"
  want:
  - { cat: option, id: autopushd }

- query: "how do I prevent the shell from overwriting existing files"
  want:
  - { cat: option, id: clobber, d: 8 }
  holdout: true

- query: "how exit immediately with a failure on non-zero exit codes"
  want:
  - { cat: option, id: errexit, d: 1 }

- query: "how immediately return from a function on non-zero exit codes"
  want:
  - { cat: option, id: errreturn, d: 1 }

- query: "how can I check zsh code for syntax errors without running the commands"
  # -> `setopt no_exec`
  want:
  - { cat: option, id: exec }

- query: "how make options set in a function local to the function"
  want:
  - { cat: option, id: localoptions, d: 3 }
  - { cat: builtin, id: emulate, d: 3 }
    # `emulate -L ..`

- query: "I want traps set in functions to be restored when function returns"
  want:
  - { cat: option, id: localtraps, d: 3 }
  - { cat: builtin, id: emulate, d: 3 }
  holdout: true

- query: "what builtin changes the current working directory"
  want:
  - { cat: builtin, id: cd }

- query: "how can I enable execution tracing"
  want:
  - { cat: option         , id: xtrace   , d: 1 }
  - { cat: builtin        , id: set      , w: 0.5, d: 5 }
  - { cat: builtin        , id: setopt   , w: 0.5, d: 5 }
  - { cat: builtin        , id: functions, w: 0.3, d: 5 }
  - { cat: complex_command, id: function , w: 0.3, d: 5 }

- query: "how to get tracing for a specific function"
  want:
  - { cat: complex_command, id: function, d: 1 }
  - { cat: option         , id: xtrace  , w: 0.2, d: 5 }
  - { cat: builtin        , id: set     , w: 0.1, d: 5 }
  - { cat: builtin        , id: setopt  , w: 0.1, d: 5 }

- query: "how do I bind a key sequence to a widget in zsh"
