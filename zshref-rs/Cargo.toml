[package]
name = "zshref"
version = "0.1.0-alpha.2"
edition = "2021"
description = "Offline static zsh reference, highly structured — CLI over parsed zsh 5.9 docs, built for agent pipelines and shells"
license = "MIT"
# crates.io enabled pre-extraction — first alpha cut from the monorepo.
publish = true

# Metadata that crates.io / docs.rs surface. Pre-extraction URLs point at
# the monorepo; update to github.com/carlwr/zshref when repo is extracted.
authors = ["Carl (carlwr)"]
repository = "https://github.com/carlwr/better-zsh"
homepage = "https://github.com/carlwr/better-zsh"
readme = "README.md"
keywords = ["zsh", "shell", "cli", "reference", "documentation"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"                   # floor: clap 4.6, proptest 1.11, jsonschema 0.54
                                        # (default build; see [package.metadata.msrv])

# Files that land in the published `.crate` tarball. Gitignored files can
# still be included here (cargo's packaging layer takes precedence over
# .gitignore — exactly what lets the dual-mode build ship `data/` even
# though it's gitignored pre-extraction). See DATA-SYNC.md.
include = [
    "src/**/*.rs",
    "src/**/*.yaml",                    # include_str!-ed by src/nlp/
    "build.rs",
    "build-inputs.txt",
    "tests/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "data/*.json",
]

[[bin]]
name = "zshref"
path = "src/main.rs"

# Opt-in NLP subsystem (`src/nlp/`). Default builds: small, no ONNX,
# minimal trust surface. `--features nlp` adds local semantic search;
# CI publishes both as separate release artifacts (`zshref`, `zshref-nlp`).
[features]
default = []
nlp = ["dep:fastembed", "dep:sha2", "dep:serde_yaml_ng", "dep:schemars"]

[dependencies]
clap = { version = "4.5", features = ["string", "wrap_help", "color", "suggestions"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
indoc = "2"
fastembed = { version = "5.13", default-features = false, features = ["ort-download-binaries-native-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
schemars = { version = "1", features = ["preserve_order"], optional = true }

[dev-dependencies]
proptest = "1"
jsonschema = { version = "0.54", default-features = false }
regex = "1"

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

# `rust-version` is the default-build floor. Cargo has no per-feature MSRV, so
# the floor with every optional feature enabled is declared here instead.
# Both are gated against the resolved dependency graph by `tests/msrv.rs`.
[package.metadata.msrv]
all-features = "1.88"                   # floor: nlp -> ort / ort-sys
