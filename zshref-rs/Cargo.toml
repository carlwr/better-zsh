[package]
name = "zshref"
version = "0.1.0-alpha.3"
edition = "2024"
description = "Offline static zsh reference, highly structured — CLI and MCP server over parsed zsh 5.9 docs, built for agent pipelines and shells"
license = "MIT"
publish = true

authors = ["Carl (carlwr)"]
repository = "https://github.com/carlwr/better-zsh"
homepage = "https://github.com/carlwr/better-zsh"
readme = "README.md"
keywords = ["zsh", "shell", "cli", "reference", "mcp"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"                   # floor: rmcp 3.3

# Gitignored files can still be included here (cargo's packaging layer takes
# precedence over .gitignore — exactly what lets the dual-mode build ship
# `data/` even though it's gitignored). See DATA-SYNC.md.
# gitignore-style patterns: anchored, or `README.md` matches at any depth
# (`npm/*/README.md` would ship).
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/data/*.json",
]

# Opt-in: a CLI-only install pulls none of the MCP dependencies.
[features]
mcp = ["dep:rmcp", "dep:tokio"]

# `cargo binstall zshref`: the archives the release workflow attaches to the
# `zshref-v*` tag — flat, both binaries in each.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/zshref-v{ version }/zshref-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "zshref"
path = "src/main.rs"

[[bin]]
name = "zshref-mcp"
path = "src/bin/zshref-mcp.rs"
required-features = ["mcp"]

[[test]]
name = "mcp"
required-features = ["mcp"]

[dependencies]
clap = { version = "4.5", features = ["string", "wrap_help", "color", "suggestions"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
indoc = "2"
rmcp = { version = "3.3", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

# `build.rs` reads `index.json.categories[].file` to generate the embed table.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
jsonschema = { version = "0.54", default-features = false }
regex = "1"

[profile.release]
lto = "thin"
strip = true
