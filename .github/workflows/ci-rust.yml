name: CI — zshref-rs

on:
  pull_request:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      # zsh-core build inputs outside its tree: `make` builds it first.
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  push:
    # Branches only: a tag push re-runs an already-covered commit, and the
    # release workflows gate themselves.
    branches:
      - "**"
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      # zsh-core build inputs outside its tree: `make` builds it first.
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  workflow_dispatch:

# A newer push supersedes a branch's or PR's run; `main` keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node first: the crate embeds TS-generated JSON at compile time.
      - uses: ./.github/actions/setup-node-pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Over a plain path cache: keys on the toolchain too, and prunes stale
      # `target/` entries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: zshref-rs

      # The Rust test suite shells out to zsh.
      - name: Install zsh
        run: |
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh

      - run: make cli-check

      - run: make cli-test

      # Proves the published `.crate` is self-contained: packaged with the same
      # include rules as a publish, then compiled standalone.
      - name: Vendored-mode test + package dry-run
        run: |
          make cli-vendored-test
          make cli-package

      # `cargo package` only builds the unpacked tarball; this runs its test
      # suite too — the extraction simulation, tests included. Shared target
      # dir: dependencies come from the steps above.
      - name: Test the packaged crate standalone
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path zshref-rs/Cargo.toml \
                    | jq -r '.packages[0].version')
          cd "zshref-rs/target/package/zshref-$version"
          ZSHREF_DATA_SOURCE=vendored CARGO_TARGET_DIR=$GITHUB_WORKSPACE/zshref-rs/target \
            cargo test --all-features --locked

      # Dependency bumps move Cargo.lock without regenerating the notices; the
      # zsh licence section follows the notice vendored into `data/` above.
      - name: Third-party notices match Cargo.lock
        run: |
          zshref-rs/scripts/third-party-notices
          git diff --exit-code -- zshref-rs/THIRD_PARTY_NOTICES.md

      - run: make cli-npm-check
