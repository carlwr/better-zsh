# Rust CI for the `zshref-rs/` crate.
#
# Scope: format check, clippy, test. Artifact publishing (a binary
# release) is out of scope here — add a separate release-zshref-rs.yml
# when a cargo publish / GH-release cadence is decided.
# Validated on GitHub-hosted workers (ubuntu-latest, ~1m30s typical).

name: CI — zshref-rs

on:
  pull_request:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "packages/zsh-core-tooldef/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  push:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "packages/zsh-core-tooldef/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # TS artifacts first: the Rust crate `include_bytes!`-embeds
      # dist/json/*.json from packages/zsh-core and zsh-core-tooldef.
      - uses: ./.github/actions/setup-node-pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the toolchain as well as Cargo.lock, and prunes stale
      # `target/` entries — a plain path cache only ever grows.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zshref-rs

      - name: Hygiene (fmt + clippy)
        run: make cli-check

      - name: Tests (fixture parity + drift-guards + fuzz)
        run: make cli-test

      - name: TS/Rust tool parity
        run: |
          make cli
          BZ_REQUIRE_PARITY=1 pnpm --filter @carlwr/zsh-core-tooldef test parity

      # Vendored-mode smoke: proves the published `.crate` is self-contained.
      # `cargo package` builds the tarball with the same include rules as
      # `cargo publish` and verifies it compiles standalone. See DATA-SYNC.md.
      # `cli-package` verifies with `--all-features`: the published tarball
      # must compile in every feature configuration, not only the default one.
      - name: Vendored-mode test + package dry-run
        run: |
          make cli-vendored-test
          make cli-package
