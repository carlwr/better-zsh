name: CI — zshref-rs

on:
  pull_request:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  push:
    # Branches only: a tag push re-runs an already-covered commit, and the
    # release workflows gate themselves.
    branches:
      - "**"
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Node first: the crate embeds TS-generated JSON at compile time.
      - uses: ./.github/actions/setup-node-pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Over a plain path cache: keys on the toolchain too, and prunes stale
      # `target/` entries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zshref-rs

      # The Rust test suite shells out to zsh.
      - name: Install zsh
        run: |
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh

      - name: Hygiene (fmt + clippy)
        run: make cli-check

      - name: Tests (fixture parity + drift-guards + fuzz)
        run: make cli-test

      # Proves the published `.crate` is self-contained: packaged with the same
      # include rules as a publish, then compiled standalone.
      - name: Vendored-mode test + package dry-run
        run: |
          make cli-vendored-test
          make cli-package

      # The npm packages, staged from this host's binaries: launchers vs
      # native binaries, offline install, `.crate` exclusion.
      - name: npm packaging check
        run: make cli-npm-check
