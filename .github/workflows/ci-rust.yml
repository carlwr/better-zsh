# Scope: format check, clippy, test. Binary releases are deferred until a
# publish cadence is decided.

name: CI — zshref-rs

on:
  pull_request:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "packages/zsh-core-tooldef/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  push:
    paths:
      - "zshref-rs/**"
      - "packages/zsh-core/**"
      - "packages/zsh-core-tooldef/**"
      - "Makefile"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/**"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Node first: the crate embeds TS-generated JSON at compile time.
      - uses: ./.github/actions/setup-node-pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Over a plain path cache: keys on the toolchain too, and prunes stale
      # `target/` entries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zshref-rs

      - name: Hygiene (fmt + clippy)
        run: make cli-check

      - name: Tests (fixture parity + drift-guards + fuzz)
        run: make cli-test

      - name: TS/Rust tool parity
        run: |
          make cli
          BZ_REQUIRE_PARITY=1 pnpm --filter @carlwr/zsh-core-tooldef test parity

      # Proves the published `.crate` is self-contained: packaged with the same
      # include rules as a publish, then compiled standalone with every feature
      # enabled, not only the default configuration.
      - name: Vendored-mode test + package dry-run
        run: |
          make cli-vendored-test
          make cli-package
