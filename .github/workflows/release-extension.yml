name: Release better-zsh (VS Code extension)

# Auth for a real release:
#   - secrets.VSCE_PAT — Azure DevOps PAT, Marketplace publish rights for
#     publisher `carlwr`
#   - secrets.OPEN_VSX_TOKEN — Open VSX token, same namespace
#
# Marketplace convention: stable on even minors, pre-release on odd minors, so
# `0.1.x` pre-release users roll forward to stable `0.2.0` cleanly.

on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (build + package, skip publish)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The tag guard and tag-bound steps below run on tag refs only, so a
      # real publish must come from one; elsewhere a manual run only rehearses.
      - name: Refuse a real publish off-tag
        if: inputs.dry_run == false && !startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          echo "real publish needs a ext-v* tag ref; got $GITHUB_REF"
          exit 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/ext-v}
          pkg_version=$(node -p "require('./packages/vscode-better-zsh/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      - working-directory: packages/vscode-better-zsh
        run: pnpm vsix

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: better-zsh-vsix
          path: packages/vscode-better-zsh/better-zsh.vsix
          if-no-files-found: error

      - name: Determine pre-release flag
        id: prerelease
        run: |
          version=$(node -p "require('./packages/vscode-better-zsh/package.json').version")
          # The Marketplace rejects semver prerelease suffixes; odd minor it is.
          [[ "$version" != *-* ]] || { echo "no -suffix versions on the Marketplace: $version"; exit 1; }
          minor=$(cut -d. -f2 <<<"$version")
          if (( minor % 2 )); then flag=--pre-release; else flag=""; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version pre-release-flag='$flag'"

      - name: Publish to VS Code Marketplace (vsce)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/vscode-better-zsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath better-zsh.vsix --no-dependencies ${{ steps.prerelease.outputs.flag }}

      - name: Publish to Open VSX (ovsx)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/vscode-better-zsh
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx -y ovsx publish better-zsh.vsix ${{ steps.prerelease.outputs.flag }}
