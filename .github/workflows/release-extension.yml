name: Release VS Code extension

# Auth for a real release:
#   - secrets.VSCE_PAT — Azure DevOps PAT, Marketplace publish rights for
#     publisher `carlwr`
#   - secrets.OPEN_VSX_TOKEN — Open VSX token, same namespace
#
# Marketplace convention: stable on even minors, pre-release on odd minors, so
# `0.1.x` pre-release users roll forward to stable `0.2.0` cleanly.
#
# `package` runs the workspace's dependency code without secrets; `publish`
# holds them, installs the extension's locked dependencies without lifecycle
# scripts, and runs only the publish tools.
#
# Local rehearsal, act: `pnpm --filter better-zsh release:act`.

on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (build + package, skip publish)"
        type: boolean
        default: true

concurrency:
  group: release-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flag: ${{ steps.prerelease.outputs.flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag guard and tag-bound steps below run on tag refs only, so a
      # real publish must come from one; elsewhere a manual run only rehearses.
      - name: Refuse a real publish off-tag
        if: inputs.dry_run == false && !startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          echo "real publish needs an ext-v* tag ref; got $GITHUB_REF"
          exit 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/ext-v}
          pkg_version=$(node -p "require('./packages/vscode-better-zsh/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      - name: Determine pre-release flag
        id: prerelease
        run: |
          version=$(node -p "require('./packages/vscode-better-zsh/package.json').version")
          # The Marketplace rejects semver prerelease suffixes; odd minor it is.
          [[ "$version" != *-* ]] || { echo "no -suffix versions on the Marketplace: $version"; exit 1; }
          minor=$(cut -d. -f2 <<<"$version")
          if (( minor % 2 )); then flag=--pre-release; else flag=""; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version pre-release-flag='$flag'"

      # vsce refuses `publish --pre-release` on a VSIX not packaged with it.
      - working-directory: packages/vscode-better-zsh
        env:
          FLAG: ${{ steps.prerelease.outputs.flag }}
        run: pnpm vsix $FLAG

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: better-zsh-vsix
          path: packages/vscode-better-zsh/better-zsh.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          install: better-zsh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: better-zsh-vsix
          path: packages/vscode-better-zsh

      # Runs on dry runs too: the rehearsal's proof that the filtered install
      # carries both publishers.
      - name: Resolve publish tools
        working-directory: packages/vscode-better-zsh
        run: |
          node "$(node -p 'require.resolve("@vscode/vsce/vsce")')" --version
          node "$(node -p 'require.resolve("ovsx/bin/ovsx")')" --version

      # `--skip-duplicate` on both: a re-run after one registry failed
      # completes the other.
      - name: Publish to VS Code Marketplace (vsce)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/vscode-better-zsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          FLAG: ${{ needs.package.outputs.flag }}
        run: node "$(node -p 'require.resolve("@vscode/vsce/vsce")')" publish --packagePath better-zsh.vsix --no-dependencies --skip-duplicate $FLAG

      - name: Publish to Open VSX (ovsx)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/vscode-better-zsh
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          FLAG: ${{ needs.package.outputs.flag }}
        run: node "$(node -p 'require.resolve("ovsx/bin/ovsx")')" publish better-zsh.vsix --skip-duplicate $FLAG
