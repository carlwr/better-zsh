name: Release zshref (Rust CLI)

# Triggers:
#   - tag push `zshref-v*` → publish to crates.io
#   - workflow_dispatch → dry-run unless input `dry_run` is false
#
# A real release needs crates.io Trusted Publishing granted to this repo; the
# token it issues is short-lived and revoked when the job ends.

on:
  push:
    tags:
      - "zshref-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The crate embeds TS-generated JSON at compile time.
      - uses: ./.github/actions/setup-node-pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zshref-rs

      # The Rust test suite shells out to zsh.
      - name: Install zsh
        run: |
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/zshref-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zshref-v}
          pkg_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' zshref-rs/Cargo.toml | head -1)
          echo "tag=$tag_version crate=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs Cargo.toml"; exit 1; }

      - name: Hygiene (fmt + clippy)
        run: make cli-check

      - name: Tests (fixture parity + drift-guards + fuzz)
        run: make cli-test

      # Vendors the JSON, then proves the packaged tarball compiles standalone
      # under every feature configuration.
      - name: Vendored-mode package check
        run: make cli-package

      # Skipped on a dry run: `--dry-run` uploads nothing, so the path stays
      # testable before the crate has Trusted Publishing configured.
      - name: Authenticate with crates.io
        id: auth
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: rust-lang/crates-io-auth-action@v1

      # Vendored: the published crate carries `data/*.json` rather than
      # reaching across the monorepo for it.
      - name: cargo publish
        working-directory: zshref-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          ZSHREF_DATA_SOURCE: vendored
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
        run: cargo publish --allow-dirty $DRY
