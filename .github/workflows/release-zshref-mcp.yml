name: Release zshref-mcp

# Triggers:
#   - tag push `zshref-mcp-v*` → publish to npm + JSR
#   - workflow_dispatch → dry-run unless input `dry_run` is false
#
# Auth for a real release — tokenless, via OIDC:
#   - npm: Trusted Publisher for @carlwr/zshref-mcp (npm package Settings →
#     Publishing access)
#   - JSR: repo linked for @carlwr/zshref-mcp (https://jsr.io → package
#     Settings → "GitHub actions")
#
# Pre-releases: a version containing `-` goes to npm under dist-tag `next`;
# stable releases under `latest`.

on:
  push:
    tags:
      - "zshref-mcp-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Tokenless publishing needs npm's OIDC exchange, added in 11.5.1; the
      # Node 22 image ships 10.x, which silently falls back to an empty
      # `.npmrc` token and 404s on the PUT.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm i -g npm@latest
          npm --version

      # package.json only — the tests below already tie the other version
      # sites to it.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/zshref-mcp-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zshref-mcp-v}
          pkg_version=$(node -p "require('./packages/zshref-mcp/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      - run: pnpm --filter @carlwr/zshref-mcp run check
      - run: pnpm --filter @carlwr/zshref-mcp run test
      - run: pnpm --filter @carlwr/zshref-mcp run test:pack
      - run: pnpm --filter @carlwr/zshref-mcp run testREGISTRY:install
      - run: pnpm --filter @carlwr/zshref-mcp run jsrREGISTRY:check

      - name: Determine npm dist-tag
        id: disttag
        run: |
          version=$(node -p "require('./packages/zshref-mcp/package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "resolved version=$version dist-tag=$tag"

      # Always runs: a dry-run that skipped this step would leave packing
      # and npm's publish preflight untested until a real tag.
      - name: npm publish (Trusted Publishing + provenance)
        working-directory: packages/zshref-mcp
        env:
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
        run: |
          pnpm build
          # npm publishes this directory as-is, and only pnpm resolves
          # `workspace:` deps to real versions — so swap in the manifest pnpm
          # resolved, then put the original back: `deno publish` refuses to
          # run against a dirty tree.
          tgz=$(pnpm pack --json --pack-destination "$RUNNER_TEMP" \
                | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).filename')
          cp package.json "$RUNNER_TEMP/manifest.orig.json"
          tar -xzOf "$tgz" package/package.json > package.json
          npm publish $DRY \
            --provenance \
            --access public \
            --tag "${{ steps.disttag.outputs.tag }}"
          cp "$RUNNER_TEMP/manifest.orig.json" package.json

      - name: JSR publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/zshref-mcp
        run: deno publish
