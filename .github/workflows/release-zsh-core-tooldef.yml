name: Release zsh-core-tooldef

# Triggers:
#   - tag push `zsh-core-tooldef-v*` → publish to npm + JSR
#   - workflow_dispatch → dry-run unless input `dry_run` is false
#
# Release after @carlwr/zsh-core: the packed manifest pins the exact version
# its `workspace:*` dep resolves to, so that version must already exist.
#
# Auth for a real release — tokenless, via OIDC:
#   - npm: Trusted Publisher for @carlwr/zsh-core-tooldef (npm package Settings
#     → Publishing access)
#   - JSR: repo linked for @carlwr/zsh-core-tooldef (https://jsr.io → package
#     Settings → "GitHub actions")
#
# Pre-releases: a version containing `-` goes to npm under dist-tag `next`;
# stable releases under `latest`.

on:
  push:
    tags:
      - "zsh-core-tooldef-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # package.json only — the tests below already tie the other version
      # sites to it.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/zsh-core-tooldef-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zsh-core-tooldef-v}
          pkg_version=$(node -p "require('./packages/zsh-core-tooldef/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      # `pretest` builds only upstream, not this package — a fresh checkout has
      # no `dist/` for `test` to read.
      - run: pnpm --filter @carlwr/zsh-core-tooldef build
      - run: pnpm --filter @carlwr/zsh-core-tooldef run check
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test:pack
      # No install check to pair with: ships no bin.
      - run: pnpm --filter @carlwr/zsh-core-tooldef run jsrREGISTRY:check

      - name: Determine npm dist-tag
        id: disttag
        run: |
          version=$(node -p "require('./packages/zsh-core-tooldef/package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "resolved version=$version dist-tag=$tag"

      # Always runs: a dry-run that skipped this step would leave packing
      # and npm's publish preflight untested until a real tag.
      - name: npm publish (Trusted Publishing + provenance)
        working-directory: packages/zsh-core-tooldef
        env:
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
        run: |
          pnpm build
          # npm publishes this directory as-is, and only pnpm resolves
          # `workspace:` deps to real versions — so swap in the manifest pnpm
          # resolved. It must stay a directory publish: npm's OIDC exchange
          # does not run for a tarball spec, and the PUT then 404s.
          tgz=$(pnpm pack --json --pack-destination "$RUNNER_TEMP" \
                | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).filename')
          tar -xzOf "$tgz" package/package.json > package.json
          npm publish $DRY \
            --provenance \
            --access public \
            --tag "${{ steps.disttag.outputs.tag }}"

      - name: JSR publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/zsh-core-tooldef
        run: deno publish
