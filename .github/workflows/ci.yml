name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  # Dedicated job for @carlwr/zshref-mcp — intentionally mirrors what a
  # standalone CI would run in the package's own repo (after extraction).
  # The monorepo-internal `integration` job re-covers unit tests via
  # `pnpm test`; the `mcp` job isolates failures of the MCP-specific
  # packaging surface. Its published-state checks live in `registry`.
  mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm --filter @carlwr/zshref-mcp run check
      - run: pnpm --filter @carlwr/zshref-mcp run test
      - run: pnpm --filter @carlwr/zshref-mcp run test:pack

  # Dedicated job for @carlwr/zsh-core-tooldef — shared tool layer
  # consumed by the MCP server, the CLI, and the extension. Unlike
  # mcp this is shared infrastructure, with no standalone-extraction
  # target today.
  tooldef:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `test` reads dist/json/tooldef.json; unlike zshref-mcp, tooldef's
      # `pretest` builds only upstream zsh-core, not itself. A fresh checkout
      # has no dist/, so the build must be explicit here.
      - run: pnpm --filter @carlwr/zsh-core-tooldef build
      - run: pnpm --filter @carlwr/zsh-core-tooldef run check
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test:pack

  # Published-state checks: they resolve currently-published npm/JSR
  # versions, so they fail legitimately until an upstream republish lands.
  # Manual-only, and a job of their own — `act` targets a job, so a job is
  # what keeps them out of everything a non-REGISTRY script can reach.
  registry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm --filter @carlwr/zsh-core run verifyREGISTRY
      # tooldef ships no bin, so it has no install check to pair with.
      - run: pnpm --filter @carlwr/zsh-core-tooldef run jsrREGISTRY:check
      - run: pnpm --filter @carlwr/zshref-mcp run verifyREGISTRY

  # zshref-web is not a pnpm workspace member (own lockfile, own
  # pnpm-workspace.yaml — it mirrors the post-extraction peer-repo
  # relationship), so no root `pnpm` script reaches it. Without a job of its
  # own the hand-maintained TS mirror of the Rust ranker has no gate at all.
  #
  # No BZ_REQUIRE_* here: nothing stages the gitignored NLP assets, so the
  # artifact-gated tests (sanity, artifact loader, markdown rendering) skip by
  # design. Everything that matters for mirror drift — ranker parity, the bare
  # lookup contract, the marker lint — is self-contained and runs.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zshref-web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          dir: zshref-web
      - run: pnpm qa

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Sequential bootstrap of upstream packages + BZ_SKIP_UPSTREAM=1 for
    # aggregator steps. Without this, workspace-recursive runs race on
    # shared `dist/` of upstream packages — each package's prebuild hook
    # tries to `clean: true`-rebuild zsh-core / tooldef, clobbering a
    # sibling's in-progress build and producing "no declaration file"
    # errors mid-typecheck. See `AGENTS.md` §`BZ_SKIP_UPSTREAM`.
    env:
      BZ_SKIP_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install early CI deps
        run: |
          # zsh backs repo scripts used by pnpm check
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh
      - name: Sequential bootstrap build of upstream packages
        run: |
          pnpm --filter @carlwr/zsh-core build
          pnpm --filter @carlwr/zsh-core-tooldef build
          pnpm --filter @carlwr/zshref-mcp build
      - run: pnpm check
      - run: pnpm test
      # `qa` minus its Rust half (no toolchain here): the cheap host gates
      # must not be local-only. Slow-types is registry-independent.
      - run: pnpm test:scripts
      - run: pnpm --filter @carlwr/zsh-core run lint:slowtypes
      - run: pnpm test:pack
      - name: Install Linux test deps
        run: |
          s=
          if command -v sudo >/dev/null 2>&1; then
            s=sudo
          fi
          # Retries help transient mirror/network failures; --no-install-recommends
          # keeps the integration image smaller without hiding warnings/errors.
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libsecret-1-0 \
            libxss1 \
            libxtst6 \
            unzip \
            xvfb
      - run: xvfb-run -a pnpm testINTERACTIVE:electron
      # zsh-path-matrix: container-only (VS Code's shell env resolution
      # defeats PATH isolation on macOS). No npm script — CI-exclusive.
      - run: xvfb-run -a pnpm --filter better-zsh exec -- bash -c 'pnpm build && tsc -p tsconfig.vscode-test.json && scripts/testINTERACTIVE-zsh-path-matrix'
      - run: xvfb-run -a pnpm testINTERACTIVE:electron-bundled
