name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  # Covered otherwise only via `integration`, which bootstraps builds first —
  # so a missing build here stayed invisible until release time.
  zsh-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # zsh-core has no `pre*` hooks, and `test` resolves JSON subpaths that
      # exist only under `dist/`.
      - run: pnpm --filter @carlwr/zsh-core build
      - run: pnpm --filter @carlwr/zsh-core run check
      - run: pnpm --filter @carlwr/zsh-core run test
      - run: pnpm --filter @carlwr/zsh-core run test:pack

  # Deliberate duplication: mirrors what a standalone CI would run for this
  # package after extraction, isolating its packaging surface.
  mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm --filter @carlwr/zshref-mcp run check
      - run: pnpm --filter @carlwr/zshref-mcp run test
      - run: pnpm --filter @carlwr/zshref-mcp run test:pack

  # Shared tool layer with several consumers; no extraction target of its own.
  tooldef:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `pretest` builds only upstream, not this package — a fresh checkout has
      # no `dist/` for `test` to read.
      - run: pnpm --filter @carlwr/zsh-core-tooldef build
      - run: pnpm --filter @carlwr/zsh-core-tooldef run check
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test
      - run: pnpm --filter @carlwr/zsh-core-tooldef run test:pack

  # Published-state checks: they resolve currently-published npm/JSR versions,
  # so they fail legitimately until an upstream republish lands. Manual-only,
  # and a job of their own so nothing else can reach them.
  registry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm --filter @carlwr/zsh-core run verifyREGISTRY
      # No install check to pair with: ships no bin.
      - run: pnpm --filter @carlwr/zsh-core-tooldef run jsrREGISTRY:check
      - run: pnpm --filter @carlwr/zshref-mcp run verifyREGISTRY

  # zshref-web has its own lockfile and is not a workspace member, so no root
  # script reaches it; without this job the hand-maintained TS mirror of the
  # Rust ranker has no gate at all. The gitignored NLP assets are absent here,
  # so asset-gated tests skip by design; the mirror-drift gates are
  # self-contained and run.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zshref-web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          dir: zshref-web
      - run: pnpm qa

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Without this, recursive runs race on the shared `dist/` of upstream
    # packages: every prebuild hook clean-rebuilds them, clobbering a sibling's
    # in-progress build ("no declaration file" mid-typecheck). Hence also the
    # bootstrap build below.
    env:
      BZ_SKIP_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install early CI deps
        run: |
          # zsh backs repo scripts used by pnpm check
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh
      - name: Sequential bootstrap build of upstream packages
        run: |
          pnpm --filter @carlwr/zsh-core build
          pnpm --filter @carlwr/zsh-core-tooldef build
          pnpm --filter @carlwr/zshref-mcp build
      - run: pnpm check
      - run: pnpm test
      # The host half of `qa` (no Rust toolchain here); these gates must not be
      # local-only.
      - run: pnpm test:scripts
      - run: pnpm --filter @carlwr/zsh-core run lint:slowtypes
      - run: pnpm test:pack
      - name: Install Linux test deps
        run: |
          s=
          if command -v sudo >/dev/null 2>&1; then
            s=sudo
          fi
          # Retries help transient mirror/network failures; --no-install-recommends
          # keeps the integration image smaller without hiding warnings/errors.
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libsecret-1-0 \
            libxss1 \
            libxtst6 \
            unzip \
            xvfb
      - run: xvfb-run -a pnpm testINTERACTIVE:electron
      # Container-only: VS Code's shell-env resolution defeats PATH isolation
      # on macOS.
      - run: xvfb-run -a pnpm --filter better-zsh exec -- bash -c 'pnpm build && tsc -p tsconfig.vscode-test.json && scripts/testINTERACTIVE-zsh-path-matrix'
      - run: xvfb-run -a pnpm testINTERACTIVE:electron-bundled
