name: CI

on:
  pull_request:
  push:
    # Branches only: a tag push re-runs an already-covered commit, and the
    # release workflows gate themselves.
    branches:
      - "**"
  workflow_dispatch:

# A newer push supersedes a branch's or PR's run; `main` keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Covered otherwise only via `integration`, which bootstraps builds first —
  # so a missing build here stayed invisible until release time.
  zsh-lexicon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # zsh-lexicon has no `pre*` hooks, and `test` resolves JSON subpaths that
      # exist only under `dist/`.
      - run: pnpm --filter @carlwr/zsh-lexicon build
      - run: pnpm --filter @carlwr/zsh-lexicon run check
      - run: pnpm --filter @carlwr/zsh-lexicon run test
      - run: pnpm --filter @carlwr/zsh-lexicon run test:pack

  # The NLP evals need the model (~127M, gitignored) and a built index
  # (minutes of CPU). Their tests skip without the assets everywhere else and
  # must fail here, so a missing asset cannot pass silently. Not part of
  # `integration`: the index build alone would dominate that job. Rehearse
  # with `ACT_JOB=nlp scripts/test-integration-act` — the index build peaks
  # above 2 GB, so the docker VM needs sizing (DEVELOPMENT.md).
  nlp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZL_REQUIRE_WEB_ARTIFACTS: "1"
      # Every readiness hook verifies: zsh-lexicon is built once, below, and no
      # later step can rebuild it mid-run.
      ZL_SKIP_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install zsh
        run: |
          # scripts/fetch-model is a zsh script
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh
      # The fetch script pins the model revision, so its hash is the key: a
      # bumped revision misses, an unchanged one restores and the fetch is a
      # size check.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/zshref-web/.aux/model
          key: nlp-model-${{ hashFiles('packages/zshref-web/scripts/fetch-model') }}
      - run: packages/zshref-web/scripts/fetch-model
      - run: pnpm --filter @carlwr/zsh-lexicon build
      # The index derives from the lexicon as rendered, the NLP (rules,
      # schemas, the Node side), the model and the embedder's package — all in
      # the key, so a hit is an index of these exact inputs. No `restore-keys`:
      # `build:index` keeps an index that validates against the lexicon, and
      # validation cannot see a changed embedder. Per OS: the vectors are what
      # the runner's ONNX build computes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/zshref-web/static/artifacts
          key: ${{ runner.os }}-nlp-index-${{ hashFiles('packages/zsh-lexicon/src/**', 'packages/zsh-lexicon/package.json', 'packages/zshref-web/nlp/**', 'packages/zshref-web/scripts/build-index.ts', 'packages/zshref-web/scripts/fetch-model', 'pnpm-lock.yaml') }}
      - run: pnpm --filter zshref-web build:index
      - run: pnpm --filter zshref-web run check
      - run: pnpm --filter zshref-web run test
      - run: pnpm --filter zshref-web build

  # Published-state checks: they resolve currently-published npm versions,
  # so they fail legitimately until an upstream republish lands. Manual-only,
  # and a job of their own so nothing else can reach them.
  registry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @carlwr/zsh-lexicon run verifyREGISTRY

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Turns every readiness call into a verify, so no step can rebuild shared
    # upstream `dist/` mid-run and clobber a sibling's in-progress build ("no
    # declaration file" mid-typecheck). Hence also the priming step below.
    env:
      ZL_SKIP_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install early CI deps
        run: |
          # zsh backs repo scripts used by pnpm check
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends zsh
      # Not `pnpm bootstrap:upstream`: under the job env that verifies rather
      # than builds, and a fresh checkout carries no build stamps yet.
      - name: Bootstrap build of the upstream package
        run: pnpm --filter @carlwr/zsh-lexicon build
      - run: pnpm check
      - run: pnpm test
      # The host half of `qa` (no Rust toolchain here); these gates must not be
      # local-only.
      - run: pnpm test:scripts
      - run: pnpm test:pack
      - name: Install Linux test deps
        run: |
          # Retries help transient mirror/network failures; --no-install-recommends
          # keeps the integration image smaller without hiding warnings/errors.
          s=; command -v sudo >/dev/null 2>&1 && s=sudo
          $s apt-get -o Acquire::Retries=3 update
          $s apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libsecret-1-0 \
            libxss1 \
            libxtst6 \
            unzip \
            xvfb
      # The VS Code download is deliberately uncached: a cache lets the test
      # harness silently fall back to an already-downloaded version when the
      # update service is unreachable; uncached, that fails hard.
      - run: xvfb-run -a pnpm testINTERACTIVE:electron
      # Container-only: VS Code's shell-env resolution defeats PATH isolation
      # on macOS.
      - run: xvfb-run -a pnpm --filter better-zsh exec -- bash -c 'pnpm build && tsc -p tsconfig.vscode-test.json && scripts/testINTERACTIVE-zsh-path-matrix'
      - run: xvfb-run -a pnpm testINTERACTIVE:electron-bundled
