name: Release zsh-core

# A real release needs tokenless OIDC granted to this repo for
# @carlwr/zsh-core, on npm (Trusted Publisher) and on JSR (linked repo).

on:
  push:
    tags:
      - "zsh-core-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

concurrency:
  group: release-zsh-core
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC: npm provenance + JSR tokenless publish + asset attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # The tag guard and tag-bound steps below run on tag refs only, so a
      # real publish must come from one; elsewhere a manual run only rehearses.
      - name: Refuse a real publish off-tag
        if: inputs.dry_run == false && !startsWith(github.ref, 'refs/tags/zsh-core-v')
        run: |
          echo "real publish needs a zsh-core-v* tag ref; got $GITHUB_REF"
          exit 1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The npm the Node image ships predates npm's OIDC exchange; without the
      # upgrade, publishing falls back to an empty token and 404s. Pinned.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm i -g npm@11.20.0
          npm --version

      # package.json only — the tests below already tie the other version
      # sites to it.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/zsh-core-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zsh-core-v}
          pkg_version=$(node -p "require('./packages/zsh-core/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      # No `pre*` hooks here, and `test` resolves JSON subpaths that exist
      # only under `dist/`.
      - run: pnpm --filter @carlwr/zsh-core build
      - run: pnpm --filter @carlwr/zsh-core run check
      - run: pnpm --filter @carlwr/zsh-core run test
      - run: pnpm --filter @carlwr/zsh-core run test:pack
      - run: pnpm --filter @carlwr/zsh-core run testREGISTRY:install
      - run: pnpm --filter @carlwr/zsh-core run jsrREGISTRY:check

      - name: Determine npm dist-tag
        id: disttag
        run: |
          version=$(node -p "require('./packages/zsh-core/package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version dist-tag=$tag"

      # Runs on dry runs too: skipping it would leave packing and npm's
      # publish preflight untested until a real tag. A version already on the
      # registry is skipped, as is JSR's below, so a re-run after a partial
      # failure completes the release.
      - name: npm publish (Trusted Publishing + provenance)
        working-directory: packages/zsh-core
        env:
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -z "$DRY" ] && npm view "@carlwr/zsh-core@$version" version >/dev/null 2>&1; then
            echo "@carlwr/zsh-core@$version is already on npm — skipping"
            exit 0
          fi
          pnpm build
          # npm publishes this directory as-is and only pnpm resolves
          # `workspace:` deps, so publish the manifest pnpm packed — then put
          # the original back: `deno publish` refuses a dirty tree.
          tgz=$(pnpm pack --json --pack-destination "$RUNNER_TEMP" \
                | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).filename')
          cp package.json "$RUNNER_TEMP/manifest.orig.json"
          tar -xzOf "$tgz" package/package.json > package.json
          npm publish $DRY \
            --provenance \
            --access public \
            --tag "${{ steps.disttag.outputs.tag }}"
          cp "$RUNNER_TEMP/manifest.orig.json" package.json

      - name: JSR publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/zsh-core
        run: |
          version=$(node -p "require('./package.json').version")
          if curl -sfo /dev/null "https://jsr.io/@carlwr/zsh-core/${version}_meta.json"; then
            echo "@carlwr/zsh-core@$version is already on JSR — skipping"
            exit 0
          fi
          deno publish

      # Repacked rather than reused: keeps the uploaded bytes tied to the
      # build this job last ran.
      - name: Pack release assets
        run: pnpm --filter @carlwr/zsh-core run pack:release

      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/zsh-core-v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/zsh-core/.aux/release/*.tar.gz

      # Create-then-upload rather than `create` with the assets inline: a
      # re-run after a partial failure finds the release already there.
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/zsh-core-v')
        working-directory: packages/zsh-core/.aux/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#zsh-core-v}
          pre=; [[ "$version" != *-* ]] || pre=--prerelease
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $pre \
            --title "zsh-core $version" \
            --notes "Generated zsh corpus JSON, JSON Schema and resolver conformance fixture for @carlwr/zsh-core $version."
          gh release upload "$TAG" --clobber *.tar.gz *.tar.gz.sha256
