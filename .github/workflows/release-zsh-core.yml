name: Release zsh-core

# Triggers:
#   - tag push `zsh-core-v*` → publish to npm + JSR
#   - workflow_dispatch → dry-run unless input `dry_run` is false
#
# Auth for a real release — tokenless, via OIDC:
#   - npm: Trusted Publisher for @carlwr/zsh-core (npm package Settings →
#     Publishing access)
#   - JSR: repo linked for @carlwr/zsh-core (https://jsr.io → package Settings
#     → "GitHub actions")
#
# Pre-releases: a version containing `-` goes to npm under dist-tag `next`;
# stable releases under `latest`.

on:
  push:
    tags:
      - "zsh-core-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: npm provenance + JSR tokenless publish.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # package.json only — the tests below already tie the other version
      # sites to it.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/zsh-core-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zsh-core-v}
          pkg_version=$(node -p "require('./packages/zsh-core/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      # Explicit: unlike the other packages, zsh-core has no `pre*` hooks,
      # and `test` resolves JSON subpaths that only exist under `dist/`.
      - run: pnpm --filter @carlwr/zsh-core build
      - run: pnpm --filter @carlwr/zsh-core run check
      - run: pnpm --filter @carlwr/zsh-core run test
      - run: pnpm --filter @carlwr/zsh-core run test:pack
      - run: pnpm --filter @carlwr/zsh-core run testREGISTRY:install
      - run: pnpm --filter @carlwr/zsh-core run jsrREGISTRY:check

      - name: Determine npm dist-tag
        id: disttag
        run: |
          version=$(node -p "require('./packages/zsh-core/package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "resolved version=$version dist-tag=$tag"

      # Always runs: a dry-run that skipped this step would leave packing
      # and npm's publish preflight untested until a real tag.
      - name: npm publish (Trusted Publishing + provenance)
        working-directory: packages/zsh-core
        env:
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
        run: |
          pnpm build
          # Publish a `pnpm pack` tarball: only pnpm resolves `workspace:`
          # deps to real versions. Publishing the directory with npm ships
          # `workspace:*` verbatim — uninstallable.
          tgz=$(pnpm pack --json --pack-destination "$RUNNER_TEMP" \
                | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).filename')
          npm publish "$tgz" $DRY \
            --provenance \
            --access public \
            --tag "${{ steps.disttag.outputs.tag }}"

      - name: JSR publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/zsh-core
        run: deno publish
