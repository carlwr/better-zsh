name: Release zsh-core

# A real release needs tokenless OIDC granted to this repo for
# @carlwr/zsh-core on npm (Trusted Publisher).
#
# `build` runs the workspace's dependency code without credentials; `publish`
# holds them, installs no dependencies, and ships what `build` uploaded.
#
# Local rehearsal, act: `pnpm --filter @carlwr/zsh-core release:act`.

on:
  push:
    tags:
      - "zsh-core-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nothing is published)"
        type: boolean
        default: true

concurrency:
  group: release-zsh-core
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag guard and tag-bound steps below run on tag refs only, so a
      # real publish must come from one; elsewhere a manual run only rehearses.
      - name: Refuse a real publish off-tag
        if: inputs.dry_run == false && !startsWith(github.ref, 'refs/tags/zsh-core-v')
        run: |
          echo "real publish needs a zsh-core-v* tag ref; got $GITHUB_REF"
          exit 1

      - uses: ./.github/actions/setup-node-pnpm

      # package.json only — the tests below already tie the other version
      # sites to it.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/zsh-core-v')
        run: |
          tag_version=${GITHUB_REF#refs/tags/zsh-core-v}
          pkg_version=$(node -p "require('./packages/zsh-core/package.json').version")
          echo "tag=$tag_version pkg=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || { echo "tag mismatch vs package.json"; exit 1; }

      # No `pre*` hooks here, and `test` resolves JSON subpaths that exist
      # only under `dist/`.
      - run: pnpm --filter @carlwr/zsh-core build
      - run: pnpm --filter @carlwr/zsh-core run check
      - run: pnpm --filter @carlwr/zsh-core run test
      - run: pnpm --filter @carlwr/zsh-core run test:pack
      # Published npm state (consent-marked): skipped by the act rehearsal.
      - if: ${{ !env.ACT }}
        run: pnpm --filter @carlwr/zsh-core run testREGISTRY:install

      # pnpm, not npm: only pnpm resolves `catalog:` / `workspace:` specs, and
      # npm publishes the manifest it is handed as-is.
      - name: Pack npm tarball
        working-directory: packages/zsh-core
        run: pnpm pack --pack-destination "$RUNNER_TEMP/npm"

      # Repacked rather than reused: keeps the uploaded bytes tied to the
      # build this job last ran.
      - name: Pack release assets
        run: pnpm --filter @carlwr/zsh-core run pack:release

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm/*.tgz
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          path: packages/zsh-core/.aux/release/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC: npm provenance + tokenless publish + asset attestation.
      id-token: write
      attestations: write
    steps:
      # For the local action only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org
          install: none

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: packages/zsh-core/.aux/release

      # Runs on dry runs too: skipping it would leave npm's publish preflight
      # untested until a real tag. A version already on the registry is
      # skipped, so a re-run after a partial failure completes the release.
      # The unpacked directory, not the tarball: npm's OIDC exchange does not
      # run for a tarball spec.
      # The npm the Node image ships predates that exchange (npm >= 11.5.1) —
      # publishing would fall back to an empty token and 404 — so a pinned
      # newer one runs through npx; a global self-upgrade breaks under act.
      - name: npm publish (Trusted Publishing + provenance)
        env:
          DRY: ${{ (github.event_name != 'push' && inputs.dry_run) && '--dry-run' || '' }}
          NPM: 11.20.0
        run: |
          npx -y "npm@$NPM" --version
          dir=$RUNNER_TEMP/npm
          tar -xzf "$dir"/*.tgz -C "$dir"
          version=$(node -p 'require(process.argv[1]).version' "$dir/package/package.json")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "resolved version=$version dist-tag=$tag"
          if [ -z "$DRY" ] && npm view "@carlwr/zsh-core@$version" version >/dev/null 2>&1; then
            echo "@carlwr/zsh-core@$version is already on npm — skipping"
            exit 0
          fi
          npx -y "npm@$NPM" publish "$dir/package" $DRY \
            --provenance \
            --access public \
            --tag "$tag" \
            --ignore-scripts

      # Tag runs that publish only: a dry run dispatched on a tag ref must not
      # create or touch the GitHub release.
      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/zsh-core-v') && (github.event_name == 'push' || inputs.dry_run == false)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/zsh-core/.aux/release/*.tar.gz

      # Create-then-upload rather than `create` with the assets inline: a
      # re-run after a partial failure finds the release already there.
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/zsh-core-v') && (github.event_name == 'push' || inputs.dry_run == false)
        working-directory: packages/zsh-core/.aux/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#zsh-core-v}
          pre=; [[ "$version" != *-* ]] || pre=--prerelease
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $pre \
            --title "zsh-core $version" \
            --notes "Generated zsh lexicon JSON, JSON Schema and resolver conformance fixture for @carlwr/zsh-core $version."
          gh release upload "$TAG" --clobber *.tar.gz *.tar.gz.sha256
