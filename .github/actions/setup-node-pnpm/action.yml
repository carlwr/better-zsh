name: Set up Node and pnpm
description: Node, pnpm, a lockfile-keyed store cache, and a frozen install.

# Uncached, every job re-downloads its whole dependency set; a restored store
# leaves only linking. Central, so no job drifts on key shape, store path, Node
# major or install flags. Jobs sharing a lockfile share a key — a losing save
# logs a benign "cache already exists".

inputs:
  dir:
    description: Directory to install in; its `pnpm-lock.yaml` keys the cache.
    default: .
  registry-url:
    description: Registry to write into `.npmrc` — publishing jobs need it for OIDC.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        registry-url: ${{ inputs.registry-url }}

    - run: corepack enable
      shell: bash

    # Fixed path: the cache step needs a literal, and `/tmp` is writable on
    # hosted runners and in containers alike. Hence one call per job — a second
    # `dir` would save the merged store under whichever key ran first.
    - run: pnpm config set store-dir /tmp/pnpm-store
      shell: bash

    # No `restore-keys`: an inexact hit reseeds from the old lockfile and saves
    # again under the new key, so the entry only grows — and `pnpm store prune`
    # empties the store rather than trimming it. Cost: a cold install whenever
    # the lockfile changes.
    - uses: actions/cache@v6
      with:
        path: /tmp/pnpm-store
        key: ${{ runner.os }}-pnpm-${{ inputs.dir }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.dir)) }}

    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.dir }}
