version: 2
updates:
  - package-ecosystem: "npm"
    # Two lockfiles: the pnpm workspace, and zshref-web outside it.
    directories:
      - "/"
      - "/zshref-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Keep @types/node on the `engines.node` major; raise both together.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # `/` covers workflows only; composite actions pin their own `uses:`. Kept
  # separate because a non-`/` directory is undocumented here: if rejected, it
  # must not take workflow coverage with it. Glob survives a rename.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
