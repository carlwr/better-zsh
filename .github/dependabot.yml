# Pre-release: `open-pull-requests-limit: 0` pauses version-update PRs
# (security updates still open); restore to 5 at release.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Keep @types/node on the `engines.node` major, and @types/vscode on the
    # extension's `engines.vscode`; raise each pair together. TypeScript 7
    # drops the JS compiler API that build tooling and a zsh-core test import.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # upload-artifact stays on v5: act's artifact server rejects v6, v7
    # (nektos/act#6021, #6022), and release workflows rehearse under act.
    # Raise by hand once those close.
    ignore:
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
  # `/` covers workflows only; composite actions pin their own `uses:`. Kept
  # separate because a non-`/` directory is undocumented here: if rejected, it
  # must not take workflow coverage with it. Glob survives a rename.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "cargo"
    directory: "/zshref-rs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
